<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="extensionName"></title>
  <style>
    body {
      font: 14px Tahoma, system-ui, sans-serif;
      width: 320px;
      box-sizing: border-box;
      padding: 12px;
      color: #222;
    }

    h1 {
      font-size: 17px;
      line-height: 1.4;
      margin: 0 0 10px;
    }

    p {
      line-height: 1.4;
      margin: 0 0 12px;
    }

    label {
      display: block;
      margin: 10px 0 5px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 7px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    button {
      padding: 7px 9px;
      cursor: pointer;
    }

    #status {
      margin-top: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h1 data-i18n="extensionPresentation"></h1>
  <p data-i18n="extensionText"></p>

  <label for="minutes" data-i18n="extensionInterval"></label>
  <input
    id="minutes"
    type="number"
    min="1"
    max="10080"
    step="1"
    value="60"
  >

  <div class="buttons">
    <button id="start" data-i18n="exportStart"></button>
    <button id="stop" data-i18n="exportStop"></button>
    <button id="now" data-i18n="exportNow"></button>
  </div>

  <div id="status" role="status" aria-live="polite"></div>

  <script src="popup.js"></script>
</body>
</html>
